services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyShop\:
        resource: '../../{Command,EventSubscriber,Repository,Service}'

    Wexample\SymfonyShop\Service\CartService:
        public: true
        arguments:
            $priceResolvers: !tagged_iterator wexample_symfony_shop.price_resolver

    Wexample\SymfonyShop\Service\CartCheckoutService:
        public: true
        arguments:
            $paidHandlers: !tagged_iterator wexample_symfony_shop.paid_handler

    Wexample\SymfonyShop\Service\StockService:
        public: true
